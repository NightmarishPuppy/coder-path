<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coder Path — проверка связи</title>
<style>
  body { margin: 0; background: #13151b; color: #ece7dc; font: 17px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #9095a6; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; background: #f2a541; color: #13151b; border: 0; border-radius: 10px; padding: 14px 28px; }
  #out { margin-top: 24px; white-space: pre-wrap; }
  .ok { color: #72c98f; } .bad { color: #f2a541; }
</style>
</head>
<body>
<main>
  <h1>Проверка сохранения</h1>
  <p>Страница запишет пробное сохранение на сервер и прочитает его обратно. Ничего личного не отправляется.</p>
  <button id="go">Проверить</button>
  <div id="out"></div>
</main>
<script>
// Firestore REST: читаем и пишем документы обычными запросами fetch, без библиотеки
const KEY = "AIzaSyC6iY7UvPjdveoBe7kH38_yo0WaKsXoYwg";
const BASE = "https://firestore.googleapis.com/v1/projects/coder-path/databases/(default)/documents";
const out = document.getElementById("out");
const line = (text, cls) => { const d = document.createElement("div"); d.textContent = text; if (cls) d.className = cls; out.append(d); };

document.getElementById("go").onclick = async () => {
  out.textContent = "";
  const id = "test-" + Math.random().toString(36).slice(2, 10);
  const stamp = new Date().toISOString();
  const url = `${BASE}/players/${id}?key=${KEY}`;
  try {
    let t = performance.now();
    const w = await fetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: { json: { stringValue: '{"test":true}' }, savedAt: { stringValue: stamp } } })
    });
    if (!w.ok) { line(`✗ Запись не прошла (код ${w.status}). ${(await w.text()).slice(0, 200)}`, "bad"); return; }
    line(`✓ Запись прошла за ${Math.round(performance.now() - t)} мс`, "ok");

    t = performance.now();
    const r = await fetch(url);
    const j = await r.json();
    if (!r.ok || j.fields?.savedAt?.stringValue !== stamp) { line(`✗ Чтение не прошло (код ${r.status})`, "bad"); return; }
    line(`✓ Чтение прошло за ${Math.round(performance.now() - t)} мс`, "ok");
    line("\nВсё работает: синхронизация будет работать и у тебя.");
  } catch (e) {
    line("✗ Сервер недоступен из этой сети. Попробуй через мобильный интернет или Wi-Fi и пришли результат.", "bad");
  }
};
</script>
</body>
</html>
